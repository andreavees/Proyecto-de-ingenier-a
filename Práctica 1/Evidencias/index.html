<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portafolio de Prácticas de Ingeniería</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f2f5f9;
            color: #243247;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #102a43, #176b87);
            color: white;
            text-align: center;
            padding: 65px 20px;
        }

        .etiqueta {
            display: inline-block;
            border: 1px solid #8bd3dd;
            color: #b8f1f5;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        header p {
            max-width: 650px;
            margin: auto;
            color: #d9e8f0;
            font-size: 17px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
            padding: 50px 22px;
        }

        .introduccion {
            text-align: center;
            margin-bottom: 35px;
        }

        .introduccion h2 {
            font-size: 29px;
            margin-bottom: 10px;
            color: #102a43;
        }

        .introduccion p {
            color: #64748b;
        }

        .practicas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .tarjeta {
            background-color: white;
            border-radius: 15px;
            padding: 28px;
            box-shadow: 0 5px 20px rgba(16, 42, 67, 0.08);
            border: 1px solid #e2e8f0;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .tarjeta:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(16, 42, 67, 0.14);
        }

        .numero {
            color: #178a9c;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .tarjeta h3 {
            font-size: 21px;
            color: #102a43;
            margin-bottom: 12px;
        }

        .tarjeta p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .boton {
            display: inline-block;
            background-color: #176b87;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .boton:hover {
            background-color: #102a43;
        }

        .acerca {
            background-color: #e2edf3;
            text-align: center;
            padding: 35px 20px;
            border-radius: 15px;
            margin-top: 45px;
        }

        .acerca h2 {
            color: #102a43;
            margin-bottom: 10px;
        }

        .acerca p {
            color: #526579;
        }

        footer {
            background-color: #102a43;
            color: #d9e8f0;
            text-align: center;
            padding: 25px 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header {
                padding: 45px 18px;
            }

            header h1 {
                font-size: 29px;
            }

            .contenedor {
                padding: 35px 18px;
            }
        }
    </style>
</head>

<body>
</html>
